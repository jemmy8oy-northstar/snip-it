<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Must name a file that actually exists in frontend/public/. Vite rewrites this href
         against `base` (/snipit/) at build time, so the built page asks for
         /snipit/balenthiran.svg; it does not fall back to anything when the file is
         missing, it just 404s. Inherited broken from web-template (#91). -->
    <link rel="icon" type="image/svg+xml" href="/balenthiran.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Template App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
