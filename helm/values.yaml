# Names every resource in the release. Keep it "snipit" — docker-build-push.yml's GitOps step
# patches apps[].image.tag in this file by app name, so the two app entries must stay named
# "backend" and "frontend".
fullnameOverride: "snipit"
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: balenthiran.co.uk
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # The app exists to upload video. nginx-ingress defaults to a 1 MB request body and 60s
    # proxy timeouts, which rejects or cuts off essentially every real recording, so both are
    # raised. The backend has its own matching cap — Uploads__MaxBytes below.
    nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  tls:
    - hosts:
        - balenthiran.co.uk
      secretName: balenthiran-tls   # shared wildcard cert — no per-project TLS setup

# No persistence block, and no PVC template, on purpose (#22). snip-it keeps nothing of a
# visitor's media between requests: the browser holds the video and re-sends it for the cut, so
# everything written to disk belongs to one job or one response and is deleted by it. What is
# left is scratch on the pod's own ephemeral disk, sized by *concurrent* work rather than
# cumulative use — which also means no RWO volume, so no `strategy: Recreate` and no single-node
# pinning. This chart is now field-for-field the shared template again.

apps:
  - name: backend
    image:
      # Must match docker-build-push.yml's BACKEND_IMAGE (snip-it-backend), which is not the
      # release name — the previous value (snipit-backend) does not exist in OCIR.
      repository: lhr.ocir.io/lr7uc6l49odc/snip-it-backend
      tag: 0.1.2                  # pinned by docker-build-push.yml's GitOps step on main
      pullPolicy: Always
    containerPort: 8080
    replicas: 1                 # the job queue is in-process, so a job must run on the pod that accepted it
    service:
      port: 80
      targetPort: 8080
    ingress:
      path: /snipit/api         # longer prefix than the frontend's, so ingress-nginx matches it first
      pathType: Prefix
    env:
      # The ingress forwards the whole path; UsePathBase strips this prefix before routing.
      - name: PathBase
        value: "/snipit"
      # FileStorage__RootPath is deliberately unset: the app falls back to a directory under the
      # OS temp path, which in this container is ephemeral disk. Setting it to a mount point was
      # the whole reason a volume existed.
      - name: Uploads__MaxBytes
        value: "2147483648"     # 2 GiB — same ceiling as proxy-body-size above
      # snip-it is deliberately open to anyone (#13), so this cap is the only thing bounding
      # what a bad day costs in transcription credits and ffmpeg CPU. Site-wide per
      # UTC day, not per visitor — there is no sign-in, so there is nobody to count. Raise it
      # freely; the app degrades into a friendly "it's a preview, try tomorrow" message rather
      # than an error when it trips.
      - name: Preview__MaxTranscriptionsPerDay
        value: "25"
      - name: ConnectionStrings__DefaultConnection
        valueFrom:
          secretKeyRef:
            name: snipit-secrets
            key: DATABASE_URL
      - name: Groq__ApiKey
        valueFrom:
          secretKeyRef:
            name: snipit-secrets
            key: GROQ_API_KEY
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  - name: frontend
    image:
      # Must match docker-build-push.yml's FRONTEND_IMAGE (snip-it-frontend).
      repository: lhr.ocir.io/lr7uc6l49odc/snip-it-frontend
      tag: 0.1.2                  # pinned by docker-build-push.yml's GitOps step on main
      pullPolicy: Always
    containerPort: 80
    replicas: 1
    service:
      port: 80
      targetPort: 80
    ingress:
      path: /snipit             # nginx.conf serves the SPA from /usr/share/nginx/html/snipit
      pathType: Prefix
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
