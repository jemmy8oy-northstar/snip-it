# The teleprompter app. Generate the Xcode project from this file rather than
# committing one: `brew install xcodegen`, then `xcodegen` in this directory.
# The generated Teleprompter.xcodeproj is ignored by git.
name: Teleprompter
options:
  bundleIdPrefix: uk.co.balenthiran
  deploymentTarget:
    iOS: "17.0"

packages:
  # WhisperKit's repo was renamed argmax-oss-swift; the product is still WhisperKit.
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.1
  ScriptFollower:
    path: ../ScriptFollower

targets:
  Teleprompter:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: ScriptFollower
        product: ScriptFollower
      - package: ScriptFollower
        product: SnipItClient
      - package: ScriptFollower
        product: Productions
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: YoursStudio
        CFBundleIconName: AppIcon
        # Reference the build settings rather than literals: without these two,
        # xcodegen writes a hardcoded CFBundleVersion of 1, and the CI override
        # (CURRENT_PROJECT_VERSION=$BUILD_NUMBER) has nothing to substitute into,
        # so every upload collides with the previous one.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Export compliance: declares the app uses no non-exempt encryption, so
        # TestFlight stops asking before each build can reach testers. If the app
        # ever adds its own crypto (not HTTPS, which is exempt), this must change
        # to true and a CCATS/self-classification report may be required.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: The teleprompter films you while you read.
        NSMicrophoneUsageDescription: The teleprompter listens so the script follows you, and records your voice with the video.
        NSPhotoLibraryAddUsageDescription: Saves a finished take to your photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.balenthiran.yourstudio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Local defaults. Codemagic overrides CURRENT_PROJECT_VERSION with
        # $BUILD_NUMBER at archive time; TestFlight rejects a repeated build
        # number, and build 1 is already taken.
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        # iPhone only: the layout is portrait-only, and an iPad build would need every orientation.
        TARGETED_DEVICE_FAMILY: "1"
        # Swift 5 mode: WhisperKit itself is built in Swift 5 mode and is not Sendable.
        SWIFT_VERSION: "5.0"
        # Set your team in Xcode (Signing & Capabilities); it is not committed.
        CODE_SIGN_STYLE: Automatic
