<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- C: the front lens, with a comma for its glint. Camera and sign-off in one mark. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#E5484D"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#3B4A7A"/>
      <stop offset="1" stop-color="#0E1222"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="330" fill="#FFF8F0"/>
  <circle cx="512" cy="512" r="270" fill="url(#glass)"/>
  <!-- comma glint, upper left of the glass -->
  <circle cx="430" cy="420" r="62" fill="#FFF8F0"/>
  <path d="M478 452 C 486 520, 452 572, 392 600 C 380 606, 372 590, 382 582 C 424 552, 440 516, 432 480 Z" fill="#FFF8F0"/>
</svg>
