<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- A: the sign-off comma. "Yours," ends a letter; the comma is the brand. Ink on paper, one red record dot. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7EF"/>
      <stop offset="1" stop-color="#EFE6D4"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#paper)"/>
  <!-- comma: a round head and a tapering tail curling down-left -->
  <circle cx="512" cy="440" r="170" fill="#1E2A4A"/>
  <path d="M640 520 C 650 680, 560 800, 400 860 C 380 868, 368 842, 386 830 C 500 760, 540 680, 520 600 Z" fill="#1E2A4A"/>
  <!-- the record dot, where a full stop would be -->
  <circle cx="742" cy="790" r="56" fill="#E5484D"/>
</svg>
