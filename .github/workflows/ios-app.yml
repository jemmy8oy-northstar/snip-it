name: iOS app

# Compiles the Teleprompter app (ios/Teleprompter) for the iOS Simulator, unsigned.
# ios-package.yml tests the plain-Swift package on Linux. The SwiftUI app around it
# uses Apple frameworks (AVFoundation, WhisperKit), so it needs macOS, and until this
# job it had never been compiled anywhere.
#
# Unsigned on purpose: this proves the code builds. Signing and TestFlight need
# James's Apple credentials and belong to the release pipeline (Codemagic), not here.
# macOS runners are free on a public repo.
on:
  pull_request:
    branches: ["**"]
    paths: ["ios/**", ".github/workflows/ios-app.yml"]
  workflow_dispatch:

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26, for Xcode 26 and the iOS 26 SDK. Codemagic archives with `xcode: latest`,
    # and macos-15's default was Xcode 16.4, so this job proved a different compiler than
    # the one that ships, and could not compile iOS 26 APIs at all.
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/Teleprompter
    steps:
      - uses: actions/checkout@v4

      - name: Show the Xcode in use
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Show schemes
        run: xcodebuild -list -project Teleprompter.xcodeproj

      - name: Build for the simulator, unsigned
        run: |
          xcodebuild build \
            -project Teleprompter.xcodeproj \
            -scheme Teleprompter \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
