# Builds the Teleprompter app (ios/Teleprompter) and sends it to TestFlight.
#
# .github/workflows/ios-app.yml proves the code compiles, unsigned, on every PR.
# This is the release half: signed with James's Apple credentials, so it runs on
# Codemagic, where those credentials live, and never in this repo.
#
# Codemagic's workflow editor — and with it the automatic code signing option —
# only supports Flutter apps, so a native Swift app has to do the same work by
# hand here. An `ios_signing:` block is NOT the equivalent: it only fetches
# profiles already uploaded to Codemagic's Code signing identities, and fails
# with "No matching profiles found" when there are none. The fetch-signing-files
# step below is the real equivalent — it asks Apple for the certificate and
# profile, creating them the first time this bundle id is built.
#
# Needs, in Codemagic:
#   Teams → Integrations → Developer Portal → the App Store Connect API key named
#     `CodeMagicKeyDealMapper`, with the App Manager role. It injects APP_STORE_CONNECT_ISSUER_ID,
#     APP_STORE_CONNECT_KEY_IDENTIFIER and APP_STORE_CONNECT_PRIVATE_KEY.
#   An environment variable group `appstore_credentials` holding a secure
#     CERTIFICATE_PRIVATE_KEY: the private key Apple issues the distribution
#     certificate against. Apple only ever hands back the public .cer, so this
#     key is what makes the certificate usable. Generate it once with
#       ssh-keygen -t rsa -b 2048 -m PEM -f cert_key -q -N ""
#     and paste the contents of `cert_key` in as the value.
#   An app record in App Store Connect for the bundle id below.
#
# Triggers on pushes to `ios-release`, and can still be started by hand from the UI.
# Needs the Codemagic webhook on the repo, which is added when the app is connected.
workflows:
  ios-testflight:
    name: Teleprompter → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Builds pushes to `ios-release` only, so a TestFlight build is a choice, not a
    # side effect of every dev merge. Release by fast-forwarding it to dev:
    #   git push origin origin/dev:ios-release
    # Its own branch rather than `main`, so the app ships on its own clock and
    # not with the web app's promotions.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-release
          include: true
          source: true
    # Most dev pushes are the web app. Skip those: a build runs only when ios/
    # (or this file, which Codemagic always watches) changed since the last
    # successful build. A skipped build still starts and fetches the source,
    # then stops, so it costs seconds of mac time rather than a full archive.
    when:
      changeset:
        includes:
          - 'ios/'
    integrations:
      app_store_connect: CodeMagicKeyDealMapper
    environment:
      xcode: latest
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: uk.co.balenthiran.yourstudio
    scripts:
      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          cd ios/Teleprompter && xcodegen

      # Automatic code signing. `--create` is what lets a brand-new bundle id
      # work: without it the build fails on a profile that does not exist yet.
      - name: Fetch or create the signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates

      - name: Use the signing profiles
        script: xcode-project use-profiles

      # CURRENT_PROJECT_VERSION: TestFlight refuses a build number it has seen,
      # and Codemagic's BUILD_NUMBER goes up by one every run of this workflow.
      # The two skip flags match ios-app.yml: WhisperKit ships macros and plugins.
      - name: Build the ipa
        script: |
          xcode-project build-ipa \
            --project ios/Teleprompter/Teleprompter.xcodeproj \
            --scheme Teleprompter \
            --archive-flags="-skipMacroValidation -skipPackagePluginValidation" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
