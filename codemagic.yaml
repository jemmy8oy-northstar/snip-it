# Builds the Teleprompter app (ios/Teleprompter) and sends it to TestFlight.
#
# .github/workflows/ios-app.yml proves the code compiles, unsigned, on every PR.
# This is the release half: signed with James's Apple credentials, so it runs on
# Codemagic, where those credentials live, and never in this repo.
#
# Codemagic's workflow editor only supports Flutter apps, so a native Swift app
# has to be configured here.
#
# Needs, in Codemagic (Teams → Integrations): an App Store Connect API key named
# `app_store_connect`, and an app record in App Store Connect for the bundle id
# below. Codemagic uses that key to fetch or create the distribution certificate
# and provisioning profile, so no signing files are committed.
#
# No `triggering` block: it runs only when started from Codemagic's UI.
workflows:
  ios-testflight:
    name: Teleprompter → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: app_store_connect
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uk.co.balenthiran.teleprompter
    scripts:
      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          cd ios/Teleprompter && xcodegen

      - name: Use the signing profiles
        script: xcode-project use-profiles

      # CURRENT_PROJECT_VERSION: TestFlight refuses a build number it has seen,
      # and Codemagic's BUILD_NUMBER goes up by one every run of this workflow.
      # The two skip flags match ios-app.yml: WhisperKit ships macros and plugins.
      - name: Build the ipa
        script: |
          xcode-project build-ipa \
            --project ios/Teleprompter/Teleprompter.xcodeproj \
            --scheme Teleprompter \
            --archive-flags="-skipMacroValidation -skipPackagePluginValidation" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
